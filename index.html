<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Builder</title>
<style>
  :root {
    --ink: #1c1b19;
    --paper: #f6f4ef;
    --panel: #ffffff;
    --line: #d8d3c8;
    --accent: #2f5d50;
    --accent-dim: #e4ece9;
    --amber: #b5771f;
    --danger: #8a3324;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'IBM Plex Sans', Arial, sans-serif;

    --cat-kettlebell: #3b5fa5;
    --cat-kettlebell-dim: #e4eaf5;
    --cat-calisthenics: #b5571f;
    --cat-calisthenics-dim: #f5e8da;
    --cat-warmups: #47804a;
    --cat-warmups-dim: #e3ede3;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body { min-height: 100vh; padding: 16px; padding-bottom: 90px; }
  .app { max-width: 540px; margin: 0 auto; }

  .app-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; padding: 4px 2px; }
  .app-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .app-sub { font-family: var(--mono); font-size: 10px; color: #8a8578; text-transform: uppercase; letter-spacing: 0.1em; }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; z-index: 10; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .tab { flex: 1; text-align: center; padding: 11px 4px 9px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #8a8578; background: none; border: none; cursor: pointer; }
  .tab .icon { display: block; font-size: 18px; margin-bottom: 2px; }
  .tab.active { color: var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 12px; }

  /* ---- Library ---- */
  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-row input { flex: 1; font-family: var(--sans); font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }

  .filter-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8a8578; margin: 10px 0 6px; }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .chip { font-family: var(--mono); font-size: 10.5px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); color: #6b6658; cursor: pointer; white-space: nowrap; }
  .chip.active { color: #fff; border-color: transparent; }
  .chip[data-cat="All"].active { background: var(--ink); }
  .chip[data-cat="Kettlebell"].active { background: var(--cat-kettlebell); }
  .chip[data-cat="Calisthenics"].active { background: var(--cat-calisthenics); }
  .chip[data-cat="Warmups"].active { background: var(--cat-warmups); }
  .chip.area-chip.active { background: var(--ink); color: #fff; }

  .sort-row { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; }
  .sort-row select { font-family: var(--sans); font-size: 12.5px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }

  .cat-group-header { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0 6px; padding-left: 2px; }

  .ex-card { border: 1px solid var(--line); border-radius: 4px; margin-bottom: 8px; background: var(--panel); overflow: hidden; }
  .ex-card-main { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; gap: 8px; }
  .ex-info { min-width: 0; flex: 1; }
  .ex-name-row { display: flex; align-items: center; gap: 7px; }
  .ex-cat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ex-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .ex-areas { font-family: var(--mono); font-size: 9.5px; color: #8a8578; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 3px; }
  .ex-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ex-expand-btn { width: 26px; height: 26px; border: none; background: none; color: #8a8578; font-size: 12px; cursor: pointer; transform: rotate(0deg); transition: transform 0.15s; }
  .ex-expand-btn.open { transform: rotate(180deg); }
  .ex-add { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 17px; line-height: 1; cursor: pointer; }
  .ex-add:active { transform: scale(0.94); }
  .ex-desc { display: none; padding: 0 14px 12px; font-size: 12.5px; color: #4a463e; line-height: 1.4; border-top: 1px solid var(--line); padding-top: 10px; }
  .ex-desc.open { display: block; }

  .empty-note { font-family: var(--mono); font-size: 12px; color: #8a8578; text-align: center; padding: 20px 10px; }

  .custom-form .field { margin-bottom: 10px; }
  .custom-form label { display: block; font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b6658; margin-bottom: 5px; }
  .custom-form input[type="text"], .custom-form textarea, .custom-form select.select-input {
    width: 100%; font-family: var(--sans); font-size: 13.5px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px;
  }
  .custom-form textarea { resize: vertical; min-height: 50px; }
  .custom-area-checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .area-check-chip { font-family: var(--mono); font-size: 10.5px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 16px; cursor: pointer; color: #6b6658; }
  .area-check-chip.checked { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ---- Builder ---- */
  .field label { display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b6658; margin-bottom: 6px; }
  .field input[type="text"] { width: 100%; font-family: var(--sans); font-size: 15px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; margin-bottom: 14px; }

  .step-row {
    display: flex; align-items: center; gap: 6px; padding: 9px 4px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    touch-action: pan-y;
  }
  .step-row:last-child { border-bottom: none; }
  .step-row.dragging { position: relative; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-radius: 3px; }
  .step-row.drop-target-above { border-top: 2px solid var(--amber); }
  .step-row.drop-target-below { border-bottom: 2px solid var(--amber); }
  .drag-handle { font-size: 16px; color: #b0aa9c; cursor: grab; padding: 4px 2px; touch-action: none; flex-shrink: 0; }
  .drag-handle:active { cursor: grabbing; }
  .step-num { font-family: var(--mono); font-size: 10.5px; color: #8a8578; width: 16px; flex-shrink: 0; }
  .step-body { flex: 1; min-width: 0; }
  .step-name { font-size: 13px; font-weight: 600; }
  .step-cat-tag { font-family: var(--mono); font-size: 9px; text-transform: uppercase; margin-left: 5px; }
  .step-hold-tag { font-family: var(--mono); font-size: 9px; color: var(--amber); text-transform: uppercase; display: block; }
  .step-dur { width: 48px; font-family: var(--mono); font-size: 12.5px; padding: 5px 3px; border: 1px solid var(--line); border-radius: 3px; text-align: center; }
  .step-dur-unit { font-family: var(--mono); font-size: 9.5px; color: #8a8578; }
  .step-btns { display: flex; gap: 3px; flex-shrink: 0; }
  .icon-btn { width: 24px; height: 24px; border: 1px solid var(--line); background: var(--panel); border-radius: 3px; font-size: 11px; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
  .icon-btn:disabled { opacity: 0.3; }
  .icon-btn.danger { color: var(--danger); border-color: var(--danger); }
  .hold-check-row { display: flex; align-items: center; gap: 5px; padding: 3px 4px 8px 26px; }
  .hold-check-row input { accent-color: var(--amber); }
  .hold-check-row label { font-family: var(--mono); font-size: 9.5px; color: #8a8578; }

  .btn { font-family: var(--sans); font-size: 14px; font-weight: 600; padding: 12px 14px; border-radius: 3px; border: 1px solid var(--ink); cursor: pointer; text-align: center; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-secondary { background: var(--panel); color: var(--ink); }
  .btn-danger { background: var(--panel); color: var(--danger); border-color: var(--danger); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .btn-row .btn { flex: 1; }

  /* ---- My Workouts ---- */
  .wk-card { padding: 14px 16px; }
  .wk-name { font-size: 15.5px; font-weight: 700; margin-bottom: 3px; }
  .wk-meta { font-family: var(--mono); font-size: 11px; color: #8a8578; margin-bottom: 10px; }
  .wk-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .wk-btns .btn { flex: none; padding: 8px 12px; font-size: 12.5px; }

  /* ---- Run / Timer ---- */
  .move-card { background: var(--accent-dim); border: 1px solid var(--accent); border-radius: 4px; padding: 16px 18px; margin-bottom: 4px; }
  .move-index { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  .move-name { font-size: 22px; font-weight: 700; line-height: 1.25; }
  .move-next { font-family: var(--mono); font-size: 11px; color: #8a8578; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .move-next .up { color: var(--ink); font-weight: 600; }

  .clock { font-family: var(--mono); font-size: 58px; font-weight: 500; text-align: center; padding: 14px 0 4px; font-variant-numeric: tabular-nums; }
  .clock.pulse { animation: pulse 0.5s ease-out; }
  @keyframes pulse { 0% { color: var(--amber); } 100% { color: var(--ink); } }

  .subline { text-align: center; font-family: var(--mono); font-size: 12px; color: #8a8578; margin-bottom: 16px; min-height: 16px; }
  .run-controls { display: flex; gap: 10px; margin: 14px 0; }
  .run-controls .btn { flex: 1; }
  .bottom-row { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .toggle-row { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: #6b6658; }
  .toggle-row input { accent-color: var(--accent); }
  .volume-row { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: #6b6658; }
  .volume-row input[type="range"] { width: 80px; accent-color: var(--accent); }

  .status-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; margin-bottom: 12px; }
  .status-eyebrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; margin-right: 6px; }
  .status-eyebrow.running .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }

  .toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--paper); font-family: var(--mono); font-size: 12px; padding: 9px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 20; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .draft-fab { position: fixed; bottom: 74px; right: 16px; background: var(--amber); color: #fff; font-family: var(--mono); font-size: 12px; padding: 9px 14px; border-radius: 20px; border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.2); cursor: pointer; display: none; z-index: 15; }
  .draft-fab.show { display: block; }

  select.select-input { width: 100%; font-family: var(--sans); font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); margin-bottom: 4px; }

  @media (prefers-reduced-motion: reduce) { .clock.pulse { animation: none; } }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div>
      <div class="app-title">Workout Builder</div>
      <div class="app-sub" id="headerSub">Exercise Library</div>
    </div>
  </div>

  <!-- LIBRARY VIEW -->
  <div id="view-library">
    <div class="search-row">
      <input type="text" id="librarySearch" placeholder="Search exercises...">
    </div>

    <div class="filter-label">Category</div>
    <div class="chip-row" id="categoryChips"></div>

    <div class="filter-label">Targeted area</div>
    <div class="chip-row" id="areaChips"></div>

    <div class="sort-row">
      <label for="sortSelect" style="font-family: var(--mono); font-size: 10.5px; color:#8a8578; text-transform:uppercase;">Sort</label>
      <select id="sortSelect">
        <option value="alpha">Alphabetical</option>
        <option value="category">By category</option>
      </select>
    </div>

    <div id="libraryList"></div>

    <div class="card custom-form">
      <div class="field"><label>Add your own exercise</label></div>
      <div class="field">
        <input type="text" id="customExName" placeholder="Exercise name">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="customExCat" class="select-input"></select>
      </div>
      <div class="field">
        <label>Targeted areas (select any)</label>
        <div class="custom-area-checks" id="customAreaChecks"></div>
      </div>
      <div class="field">
        <label>Description (optional)</label>
        <textarea id="customExDesc" placeholder="Short cue or setup note"></textarea>
      </div>
      <button class="btn btn-secondary" id="addCustomExBtn" style="width:100%;">Add to library</button>
    </div>
  </div>

  <!-- BUILDER VIEW -->
  <div id="view-builder" style="display:none;">
    <div class="card">
      <div class="field">
        <label for="draftName">Workout name</label>
        <input type="text" id="draftName" placeholder="e.g. Kettlebell Push Day">
      </div>
      <div id="draftStepsList"></div>
      <div id="draftEmptyNote" class="empty-note">No exercises yet — add some from the Library tab.</div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="clearDraftBtn">Clear</button>
        <button class="btn btn-secondary" id="runDraftBtn">Run now</button>
        <button class="btn btn-primary" id="saveDraftBtn">Save workout</button>
      </div>
    </div>
  </div>

  <!-- MY WORKOUTS VIEW -->
  <div id="view-workouts">
    <div id="workoutsList"></div>
    <div id="workoutsEmptyNote" class="empty-note" style="display:none;">No saved workouts yet — build one in the Builder tab.</div>
  </div>

  <!-- RUN VIEW -->
  <div id="view-run" style="display:none;">
    <div class="status-eyebrow" id="statusRow">
      <span><span class="dot"></span><span id="statusText">Stopped</span></span>
    </div>

    <div class="move-card">
      <div class="move-index" id="moveIndex">—</div>
      <div class="move-name" id="moveName">Select a workout to run</div>
      <div class="move-next" id="moveNext"></div>
    </div>

    <div class="clock" id="clockDisplay">00:00</div>
    <div class="subline" id="subline"></div>

    <div class="run-controls">
      <button class="btn btn-primary" id="toggleBtn">Start</button>
      <button class="btn btn-secondary" id="skipBtn">Skip ⏭</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>

    <div class="bottom-row">
      <div class="toggle-row"><input type="checkbox" id="soundToggle" checked><label for="soundToggle">Beep</label></div>
      <div class="toggle-row"><input type="checkbox" id="voiceToggle" checked><label for="voiceToggle">Announce</label></div>
      <div class="volume-row"><label for="volumeInput">Vol</label><input type="range" id="volumeInput" min="0" max="100" value="90"></div>
    </div>
    <div class="bottom-row" style="margin-top:6px;">
      <button class="btn btn-secondary" id="testVoiceBtn" style="flex:none; padding:8px 14px; font-size:12.5px;">Test voice</button>
      <span id="voiceDiagResult" style="font-family: var(--mono); font-size: 11px; color: #8a8578;"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="draft-fab" id="draftFab">Draft: 0 · view →</button>

<div class="tabbar">
  <button class="tab active" data-view="library"><span class="icon">📚</span>Library</button>
  <button class="tab" data-view="builder"><span class="icon">🛠</span>Builder</button>
  <button class="tab" data-view="workouts"><span class="icon">📋</span>My Workouts</button>
  <button class="tab" data-view="run"><span class="icon">⏱</span>Run</button>
</div>

<script>
(function () {
  // =========================================================
  // Categories / Areas / Colors
  // =========================================================
  const CATEGORIES = ['Kettlebell', 'Calisthenics', 'Warmups'];
  const AREAS = ['Arms', 'Legs', 'Core', 'Shoulders', 'Chest', 'Mobility', 'Warmup', 'Full Body'];
  const CATEGORY_COLORS = {
    'Kettlebell':   { color: 'var(--cat-kettlebell)',   dim: 'var(--cat-kettlebell-dim)' },
    'Calisthenics': { color: 'var(--cat-calisthenics)', dim: 'var(--cat-calisthenics-dim)' },
    'Warmups':      { color: 'var(--cat-warmups)',      dim: 'var(--cat-warmups-dim)' }
  };

  // =========================================================
  // Exercise Library (built-in) — id, name, category, areas[], description
  // =========================================================
  const BUILTIN_LIBRARY = [
    // ---------- KETTLEBELL ----------
    { id:'kb_two_hand_swing', name:'Two-hand kettlebell swing', category:'Kettlebell', areas:['Full Body','Legs'], description:'Hip-hinge the kettlebell between your legs and drive through the hips to swing it to chest height.' },
    { id:'kb_one_arm_swing', name:'One-arm kettlebell swing', category:'Kettlebell', areas:['Full Body','Core'], description:'Same hip-driven swing as the two-hand version, performed one arm at a time to add an anti-rotation challenge.' },
    { id:'kb_alt_swing', name:'Alternating-hand swing', category:'Kettlebell', areas:['Full Body','Core'], description:'Swing the kettlebell and pass it between hands at the top of each rep for continuous single-arm work.' },
    { id:'kb_snatch', name:'Kettlebell snatch', category:'Kettlebell', areas:['Full Body','Shoulders'], description:'Explosively pull the kettlebell from between the legs to a locked-out overhead position in one motion.' },
    { id:'kb_clean', name:'Kettlebell clean', category:'Kettlebell', areas:['Full Body','Arms'], description:'Pull the kettlebell from the swing into a racked position against the forearm and chest.' },
    { id:'kb_clean_press', name:'Clean and press', category:'Kettlebell', areas:['Full Body','Shoulders'], description:'Clean the kettlebell to the rack, then press it overhead for a combined pull-and-push movement.' },
    { id:'kb_high_pull', name:'High pull', category:'Kettlebell', areas:['Shoulders','Arms'], description:'Swing the kettlebell up and pull the elbow high and back, like an upright row with momentum.' },
    { id:'kb_halo', name:'Kettlebell halo', category:'Kettlebell', areas:['Shoulders','Core'], description:'Circle the kettlebell around your head, keeping the core braced as it passes behind your neck.' },
    { id:'kb_figure8', name:'Figure 8', category:'Kettlebell', areas:['Core','Legs'], description:'Pass the kettlebell in a figure-eight path between and around your legs from a squat stance.' },
    { id:'kb_around_body', name:'Around-the-body pass', category:'Kettlebell', areas:['Core','Arms'], description:'Circle the kettlebell around your waist, passing it hand to hand at your back and front.' },
    { id:'kb_axe_chop', name:'Axe chop', category:'Kettlebell', areas:['Core','Shoulders'], description:'Swing the kettlebell diagonally from shoulder to opposite hip in a chopping motion for rotational core strength.' },
    { id:'kb_side_swing', name:'Side swing', category:'Kettlebell', areas:['Core','Legs'], description:'Swing the kettlebell side to side at hip height, pivoting through the hips and core.' },
    { id:'kb_goblet_squat', name:'Goblet squat', category:'Kettlebell', areas:['Legs'], description:'Hold the kettlebell at chest height and squat down, keeping the chest tall and elbows inside the knees.' },
    { id:'kb_front_squat', name:'Kettlebell front squat', category:'Kettlebell', areas:['Legs'], description:'Rack one or two kettlebells at the shoulders and squat, keeping the torso upright throughout.' },
    { id:'kb_sumo_squat', name:'Kettlebell sumo squat', category:'Kettlebell', areas:['Legs'], description:'Squat with a wide stance and toes turned out, holding the kettlebell between the legs.' },
    { id:'kb_reverse_lunge', name:'Reverse lunge with kettlebell', category:'Kettlebell', areas:['Legs'], description:'Step backward into a lunge while holding the kettlebell at the chest or by your side.' },
    { id:'kb_lateral_lunge', name:'Kettlebell lateral lunge', category:'Kettlebell', areas:['Legs'], description:'Step out to the side and sit back into that hip while holding the kettlebell at the chest.' },
    { id:'kb_step_up', name:'Kettlebell step-up', category:'Kettlebell', areas:['Legs'], description:'Step onto a sturdy chair or ledge while holding the kettlebell, driving through the lead heel.' },
    { id:'kb_bulgarian_split', name:'Kettlebell Bulgarian split squat', category:'Kettlebell', areas:['Legs'], description:'With your rear foot elevated on a chair, lower into a lunge while holding the kettlebell for added load.' },
    { id:'kb_overhead_press', name:'Kettlebell overhead press', category:'Kettlebell', areas:['Shoulders','Arms'], description:'Press the kettlebell from the rack position straight overhead until the arm is locked out.' },
    { id:'kb_push_press', name:'Kettlebell push press', category:'Kettlebell', areas:['Shoulders','Legs'], description:'Use a slight knee dip and drive to help press the kettlebell overhead with more power than a strict press.' },
    { id:'kb_bottoms_up', name:'Bottoms-up press', category:'Kettlebell', areas:['Shoulders','Arms'], description:'Press the kettlebell overhead with the bell facing down, demanding extra grip and shoulder stability.' },
    { id:'kb_farmer_carry', name:"Farmer's carry", category:'Kettlebell', areas:['Full Body','Arms'], description:'Walk while holding a kettlebell in each hand at your sides, keeping the torso tall and shoulders back.' },
    { id:'kb_suitcase_carry', name:'Suitcase carry', category:'Kettlebell', areas:['Core','Arms'], description:'Walk while holding a single kettlebell at your side, resisting the pull to lean toward the weight.' },
    { id:'kb_rack_carry', name:'Rack carry', category:'Kettlebell', areas:['Core','Shoulders'], description:'Walk while holding the kettlebell racked at your shoulder, bracing the core against the offset load.' },

      { id: 'wk_morning', name: 'Morning Workout', steps: morningSteps },
      { id: 'wk_morning_ext', name: 'Morning Workout Extended', steps: extSteps },
      { id: 'wk_circuit', name: '20-Minute Kettlebell Circuit', steps: circuitSteps },
      { id: 'wk_stretch', name: 'Stretch Routine', steps: stretchSteps },
    ];
  }

  // =========================================================
  // State
  // =========================================================
  let state = {
    view: 'library',
    searchTerm: '',
    activeCategory: 'All',
    activeAreas: [],
    sortMode: 'alpha',
    customExercises: [],
    customFormAreas: [],
    workouts: [],

    runningWorkoutName: ''
  };

  function fullLibrary() { return [...BUILTIN_LIBRARY, ...state.customExercises]; }

  // =========================================================
  // Persistent storage
  // Uses the browser's built-in localStorage since this file runs as a
  // plain self-hosted page (GitHub Pages, Netlify, etc.) with no backend
  // and no access to Claude's artifact storage. Data stays on whichever
  // device/browser it was saved from — it does not sync across devices.
  // =========================================================
  const STORAGE_KEY_WORKOUTS = 'workout_builder_workouts_v1';
  const STORAGE_KEY_EXERCISES = 'workout_builder_custom_exercises_v1';

  async function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_WORKOUTS);
      state.workouts = raw ? JSON.parse(raw) : null;
    } catch (e) { state.workouts = null; }
    if (!state.workouts) { state.workouts = seedWorkouts(); await saveWorkouts(); }

    try {
      const raw = localStorage.getItem(STORAGE_KEY_EXERCISES);
      state.customExercises = raw ? JSON.parse(raw) : [];
    } catch (e) { state.customExercises = []; }
  }
  async function saveWorkouts() {
    try { localStorage.setItem(STORAGE_KEY_WORKOUTS, JSON.stringify(state.workouts)); } catch (e) {}
  }
  async function saveCustomExercises() {
    try { localStorage.setItem(STORAGE_KEY_EXERCISES, JSON.stringify(state.customExercises)); } catch (e) {}
  }

  // =========================================================
  // Utility
  // =========================================================
  function formatTime(totalSeconds) {
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = Math.floor(totalSeconds % 60);
    if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function stepsTotalDuration(steps) { return steps.reduce((s, st) => s + st.duration, 0); }
  function cumulativeStart(steps, uptoIndex) { let t = 0; for (let i = 0; i < uptoIndex; i++) t += steps[i].duration; return t; }
  function hasHold(steps) { return steps.some(s => s.holdIndefinite); }
  function findExerciseByName(name) { return fullLibrary().find(e => e.name === name); }

  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => switchView(tab.dataset.view)));

  // =========================================================
  // BUILDER VIEW (with drag-and-drop reorder)
  // =========================================================
  const draftNameInput = document.getElementById('draftName');

  let dragState = null; // { fromIndex, pointerId, rowEl, startY, rowStartTop, targetIndex }

  function renderBuilder() {
    draftNameInput.value = state.draft.name || '';
    const list = document.getElementById('draftStepsList');
    const emptyNote = document.getElementById('draftEmptyNote');
    list.innerHTML = '';
    emptyNote.style.display = state.draft.steps.length === 0 ? '' : 'none';

    state.draft.steps.forEach((step, idx) => {
      const ex = findExerciseByName(step.name);
      const colors = ex ? CATEGORY_COLORS[ex.category] : null;
      const isLast = idx === state.draft.steps.length - 1;

      const row = document.createElement('div');
      row.className = 'step-row';

      row.innerHTML = `

          ${step.holdIndefinite ? '<span class="step-hold-tag">holds indefinitely — beeps every interval until skipped</span>' : ''}
        </div>
        <input type="number" class="step-dur" min="5" step="5" value="${step.duration}">
        <span class="step-dur-unit">s</span>
        <div class="step-btns"></div>
      `;

      const durInput = row.querySelector('.step-dur');
      durInput.addEventListener('change', () => {
        const v = parseInt(durInput.value, 10);
        step.duration = (v && v > 0) ? v : 30;
        renderBuilder();
      });

      const btnWrap = row.querySelector('.step-btns');
      const upBtn = document.createElement('button');
      upBtn.className = 'icon-btn'; upBtn.textContent = '↑'; upBtn.disabled = idx === 0;
      upBtn.addEventListener('click', () => {
        [state.draft.steps[idx - 1], state.draft.steps[idx]] = [state.draft.steps[idx], state.draft.steps[idx - 1]];
        renderBuilder();
      });
      const downBtn = document.createElement('button');
      downBtn.className = 'icon-btn'; downBtn.textContent = '↓'; downBtn.disabled = isLast;
      downBtn.addEventListener('click', () => {
        [state.draft.steps[idx + 1], state.draft.steps[idx]] = [state.draft.steps[idx], state.draft.steps[idx + 1]];
        renderBuilder();
      });
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger'; delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => { state.draft.steps.splice(idx, 1); renderBuilder(); updateDraftFab(); });

      btnWrap.appendChild(upBtn); btnWrap.appendChild(downBtn); btnWrap.appendChild(delBtn);
      list.appendChild(row);

      const holdRow = document.createElement('div');
      holdRow.className = 'hold-check-row';
      const holdId = 'hold_' + idx;
      holdRow.innerHTML = `<input type="checkbox" id="${holdId}"><label for="${holdId}">Hold indefinitely (repeat beep until skipped)</label>`;
      const cb = holdRow.querySelector('input');
      cb.checked = !!step.holdIndefinite;
      cb.addEventListener('change', () => { step.holdIndefinite = cb.checked; renderBuilder(); });
      list.appendChild(holdRow);

      // Drag handle wiring
      const handle = row.querySelector('.drag-handle');
      handle.addEventListener('pointerdown', (e) => startDrag(e, row, idx));
    });

    updateDraftFab();
  }

  function startDrag(e, rowEl, fromIndex) {
    e.preventDefault();
    const list = document.getElementById('draftStepsList');
    dragState = {
      fromIndex, targetIndex: fromIndex,
      pointerId: e.pointerId,
      rowEl, startY: e.clientY,
      rowStartTop: rowEl.getBoundingClientRect().top,
      listEl: list
    };
    rowEl.classList.add('dragging');
    rowEl.style.position = 'relative';
    try { rowEl.setPointerCapture(e.pointerId); } catch (err) {}
    rowEl.addEventListener('pointermove', onDragMove);
    rowEl.addEventListener('pointerup', onDragEnd);
    rowEl.addEventListener('pointercancel', onDragEnd);
  }

  function onDragMove(e) {
    if (!dragState) return;
    const dy = e.clientY - dragState.startY;
    dragState.rowEl.style.transform = `translateY(${dy}px)`;

    // Determine which row we're hovering over (excluding the dragged row itself)
    const rows = Array.from(dragState.listEl.querySelectorAll('.step-row'));
    let target = dragState.fromIndex;
    for (let i = 0; i < rows.length; i++) {
      if (rows[i] === dragState.rowEl) continue;
      const rect = rows[i].getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      const rowIdx = parseInt(rows[i].dataset.index, 10);
      if (e.clientY < mid) { target = rowIdx; break; }
      target = rowIdx + 1;
    }
    target = Math.max(0, Math.min(state.draft.steps.length - 1, target));

    rows.forEach(r => r.classList.remove('drop-target-above', 'drop-target-below'));
    if (target !== dragState.fromIndex) {
      const indicatorRow = rows.find(r => parseInt(r.dataset.index, 10) === target);
      if (indicatorRow) {
        if (target < dragState.fromIndex) indicatorRow.classList.add('drop-target-above');
        else indicatorRow.classList.add('drop-target-below');
      }
    }
    dragState.targetIndex = target;
  }

  function onDragEnd(e) {
    if (!dragState) return;
    const { fromIndex, targetIndex, rowEl } = dragState;
    rowEl.removeEventListener('pointermove', onDragMove);
    rowEl.removeEventListener('pointerup', onDragEnd);
    rowEl.removeEventListener('pointercancel', onDragEnd);
    rowEl.style.transform = '';
    rowEl.classList.remove('dragging');

    if (targetIndex !== fromIndex) {
      const steps = state.draft.steps;
      const [moved] = steps.splice(fromIndex, 1);
      const insertAt = targetIndex > fromIndex ? targetIndex - 1 : targetIndex;
      steps.splice(Math.max(0, Math.min(steps.length, insertAt)), 0, moved);
    }
    dragState = null;
    renderBuilder();
  }

  document.getElementById('clearDraftBtn').addEventListener('click', () => {
    state.draft = { name: '', steps: [] };
    state.editingWorkoutId = null;
    renderBuilder();
  });

  document.getElementById('saveDraftBtn').addEventListener('click', async () => {
    const name = (state.draft.name || '').trim();
    if (!name) { showToast('Give the workout a name first'); return; }
    if (state.draft.steps.length === 0) { showToast('Add at least one exercise'); return; }
    const stepsCopy = state.draft.steps.map(s => ({ ...s }));
    if (state.editingWorkoutId) {
      const wk = state.workouts.find(w => w.id === state.editingWorkoutId);
      if (wk) { wk.name = name; wk.steps = stepsCopy; }
    } else {
      state.workouts.push({ id: 'wk_' + Date.now(), name, steps: stepsCopy });
    }
    await saveWorkouts();
    showToast('Workout saved');
    state.draft = { name: '', steps: [] };
    state.editingWorkoutId = null;
    switchView('workouts');
  });

  document.getElementById('runDraftBtn').addEventListener('click', () => {
    if (state.draft.steps.length === 0) { showToast('Add at least one exercise'); return; }
    loadRunFromSteps(state.draft.steps.map(s => ({ ...s })), state.draft.name || 'Untitled Workout');
    switchView('run');
  });

  // =========================================================
  // RUN / TIMER ENGINE
  // =========================================================
  const clockDisplay = document.getElementById('clockDisplay');
  const subline = document.getElementById('subline');
  const statusText = document.getElementById('statusText');
  const statusRow = document.getElementById('statusRow');
  const moveIndex = document.getElementById('moveIndex');
  const moveName = document.getElementById('moveName');
  const moveNext = document.getElementById('moveNext');
  const toggleBtn = document.getElementById('toggleBtn');
  const skipBtn = document.getElementById('skipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const soundToggle = document.getElementById('soundToggle');
  const voiceToggle = document.getElementById('voiceToggle');
  const volumeInput = document.getElementById('volumeInput');

  let mode_running = false;
  let elapsedMs = 0;
  let lastTick = null;
  let rafId = null;
  let nextBeepAt = 0;
  let workoutEnded = false;
  let currentMoveIndex = 0;
  let audioCtx = null;

  function loadRunFromSteps(steps, name) {
    stopRunTimer();
    state.runningSteps = steps;
    state.runningWorkoutName = name;
    elapsedMs = 0; nextBeepAt = 0; workoutEnded = false; currentMoveIndex = 0;
    renderRunHeader();
  }

  function renderRunHeader() {
    if (!state.runningSteps) {
      moveName.textContent = 'Select a workout to run';
      moveIndex.textContent = '—';
      moveNext.textContent = '';
      subline.textContent = 'Pick a workout from My Workouts, or build one.';
      clockDisplay.textContent = '00:00';
      toggleBtn.disabled = true; skipBtn.disabled = true; resetBtn.disabled = true;
      return;
    }
    toggleBtn.disabled = false; skipBtn.disabled = false; resetBtn.disabled = false;
    updateMoveCard(currentMoveIndex);
    updateDisplay();
  }

  function updateMoveCard(idxIn) {
    const steps = state.runningSteps;
    if (!steps) return;
    const total = steps.length;
    const idx = Math.min(idxIn, total - 1);
    const step = steps[idx];
    moveIndex.textContent = `${state.runningWorkoutName} · Move ${idx + 1} of ${total} · ${step.duration}s`;
    moveName.textContent = step.name;
    if (step.holdIndefinite) {
      moveNext.innerHTML = `Holding — beep repeats every ${step.duration}s. Tap Skip to move on.`;
    } else if (idx + 1 < total) {
      const next = steps[idx + 1];
      moveNext.innerHTML = `Next: <span class="up">${escapeHtml(next.name)}</span> (${next.duration}s)`;
    } else {
      moveNext.innerHTML = `Final movement — an end beep signals workout complete`;
    }
  }

  function updateDisplay() {
    const steps = state.runningSteps;
    const totalSeconds = elapsedMs / 1000;
    clockDisplay.textContent = formatTime(totalSeconds);
    if (!steps) return;

    updateMoveCard(currentMoveIndex);
    const totalDurationLabel = formatTime(stepsTotalDuration(steps));

    if (workoutEnded) {
      subline.textContent = `Workout complete · ${totalDurationLabel}`;
    } else if (mode_running) {
      const remaining = Math.max(0, Math.ceil(nextBeepAt - totalSeconds));
      subline.textContent = `Next beep in ${remaining}s`;
    } else {
      const durationNote = hasHold(steps) ? `${totalDurationLabel} + hold(s)` : totalDurationLabel;
      subline.textContent = elapsedMs > 0 ? 'Paused' : `${steps.length} moves · ${durationNote}`;
    }
  }

  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function toneSequence(tones) {
    if (!soundToggle.checked) return;
    try {
      const ctx = ensureAudioCtx();
      const vol = Math.max(0, Math.min(100, parseInt(volumeInput.value, 10))) / 100;
      const masterGain = ctx.createGain();
      masterGain.gain.value = 0.9 * vol;
      masterGain.connect(ctx.destination);
      tones.forEach(([startOffset, freq, duration]) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.value = freq;
        const startTime = ctx.currentTime + startOffset;
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(1, startTime + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain); gain.connect(masterGain);
        osc.start(startTime); osc.stop(startTime + duration + 0.02);
      });
    } catch (e) {}
  }
  function playBeep() { toneSequence([[0, 1046.5, 0.16], [0.22, 1046.5, 0.16]]); }
  function playEndBeep() { toneSequence([[0, 1318.5, 0.2], [0.24, 1046.5, 0.2], [0.48, 784.0, 0.35]]); }

  function speakMove(step) {
    if (!voiceToggle.checked) return;
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      const utterance = new SpeechSynthesisUtterance(step.name);
      utterance.rate = 1; utterance.pitch = 1;
      utterance.volume = Math.max(0, Math.min(100, parseInt(volumeInput.value, 10))) / 100;
      window.speechSynthesis.speak(utterance);
    } catch (e) {}
  }

  function tick(now) {
    if (!mode_running) return;
    if (lastTick === null) lastTick = now;
    const delta = now - lastTick;
    lastTick = now;
    elapsedMs += delta;
    const totalSeconds = elapsedMs / 1000;
    const steps = state.runningSteps;

    if (totalSeconds >= nextBeepAt) {
      const total = steps.length;
      const cur = steps[currentMoveIndex];

      if (cur.holdIndefinite) {
        // Stay on the current exercise, just re-beep on its own interval.
        playBeep();
        nextBeepAt += cur.duration;
      } else {
        const nextIndex = currentMoveIndex + 1;
        if (nextIndex < total) {
          playBeep();
          speakMove(steps[nextIndex]);
          currentMoveIndex = nextIndex;
          nextBeepAt += steps[nextIndex].duration;
        } else {
          playEndBeep();
          workoutEnded = true;
          pauseRunTimer();
          updateDisplay();
          return;
        }
      }
      clockDisplay.classList.remove('pulse');
      void clockDisplay.offsetWidth;
      clockDisplay.classList.add('pulse');
    }

    updateDisplay();
    rafId = requestAnimationFrame(tick);
  }

  function startRunTimer() {
    if (!state.runningSteps || mode_running) return;
    if (workoutEnded) { elapsedMs = 0; nextBeepAt = 0; workoutEnded = false; currentMoveIndex = 0; }
    ensureAudioCtx();
    mode_running = true;
    lastTick = null;
    if (elapsedMs === 0) {
      currentMoveIndex = 0;
      nextBeepAt = state.runningSteps[0].duration;
      speakMove(state.runningSteps[0]);
    }
    toggleBtn.textContent = 'Pause';
    statusText.textContent = 'Running';
    statusRow.classList.add('running');
    rafId = requestAnimationFrame(tick);
  }

  function pauseRunTimer() {
    mode_running = false;
    cancelAnimationFrame(rafId);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    toggleBtn.textContent = workoutEnded ? 'Start' : 'Resume';
    statusText.textContent = workoutEnded ? 'Complete' : 'Paused';
    statusRow.classList.remove('running');
    skipBtn.disabled = workoutEnded;
    updateDisplay();
  }

  function stopRunTimer() {
    mode_running = false;
    cancelAnimationFrame(rafId);
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  }

  function resetRunTimer() {
    stopRunTimer();
    elapsedMs = 0; nextBeepAt = 0; workoutEnded = false; currentMoveIndex = 0;
    toggleBtn.textContent = 'Start';
    statusText.textContent = 'Stopped';
    statusRow.classList.remove('running');
    skipBtn.disabled = false;
    if (state.runningSteps) updateMoveCard(0);
    updateDisplay();
  }

  function skipMove() {
    if (!state.runningSteps || workoutEnded) return;
    const steps = state.runningSteps;
    const total = steps.length;
    ensureAudioCtx();
    const nextIndex = currentMoveIndex + 1;

    if (nextIndex < total) {
      playBeep();
      speakMove(steps[nextIndex]);
      currentMoveIndex = nextIndex;
      elapsedMs = cumulativeStart(steps, nextIndex) * 1000;
      nextBeepAt = cumulativeStart(steps, nextIndex) + steps[nextIndex].duration;
    } else {
      playEndBeep();
      workoutEnded = true;
      pauseRunTimer();
    }
    clockDisplay.classList.remove('pulse');
    void clockDisplay.offsetWidth;
    clockDisplay.classList.add('pulse');
    updateDisplay();
  }

  toggleBtn.addEventListener('click', () => { if (mode_running) pauseRunTimer(); else startRunTimer(); });
  skipBtn.addEventListener('click', skipMove);
  resetBtn.addEventListener('click', resetRunTimer);

  document.getElementById('testVoiceBtn').addEventListener('click', () => {
    const resultEl = document.getElementById('voiceDiagResult');
    if (!('speechSynthesis' in window)) { resultEl.textContent = 'speechSynthesis not supported in this browser'; return; }
    try {
      window.speechSynthesis.cancel();
      if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      const utterance = new SpeechSynthesisUtterance('Voice test');
      utterance.volume = 1;
      let spoke = false;
      utterance.onstart = () => { spoke = true; resultEl.textContent = 'Speaking now...'; };
      utterance.onend = () => { resultEl.textContent = spoke ? 'Finished — you should have heard it' : 'Ended without starting — likely blocked'; };
      utterance.onerror = (e) => { resultEl.textContent = 'Error: ' + (e.error || 'unknown'); };
      resultEl.textContent = 'Requesting speech...';
      window.speechSynthesis.speak(utterance);
      setTimeout(() => { if (!spoke) resultEl.textContent = 'No onstart event after 1.5s — browser likely denied audio focus'; }, 1500);
    } catch (e) { resultEl.textContent = 'Threw error: ' + e.message; }
  });

  // =========================================================
  // Boot
  // =========================================================
  async function boot() {
    document.getElementById('libraryList').innerHTML = '<div class="empty-note">Loading library…</div>';
    await loadData();
    renderLibrary();
    renderWorkoutsList();
    renderRunHeader();
  }
  boot();
})();
</script>

</body>
</html>
